[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Manjineshwaran",email = "manjiehswaran@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.140.13,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
